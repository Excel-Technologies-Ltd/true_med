name: Frappe Docker Development Build and Deploy for True Med

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy"
        required: true
        default: "master"
        type: string

env:
  REGISTRY: registry.aninda.me
  HARBOR_PROJECT: truemed
  BASE_REGISTRY: registry.aninda.me/dockerhub/library
  TAG: 'latest'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          repository: Excel-Technologies-Ltd/excel-frappe-docker

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: login to harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Pull base image through Harbor proxy
        run: |
          sed -i "s|^FROM python:|FROM ${BASE_REGISTRY}/python:|" images/custom/Containerfile
          grep -n "^FROM" images/custom/Containerfile

      - name: Build and Push Frappe Docker Image
        run: |
          # Define apps JSON
          export APPS_JSON='[
            {
              "url": "https://github.com/frappe/erpnext",
              "branch": "version-14"
            },
            {
              "url": "https://github.com/frappe/hrms.git",
              "branch": "version-14"
            },
            {
              "url": "https://github.com/Excel-Technologies-Ltd/true_med.git",
              "branch": "master"
            },
            {
              "url": "https://github.com/Excel-Technologies-Ltd/frappe_auth.git",
              "branch": "master"
            },
            {
              "url": "https://github.com/Excel-Technologies-Ltd/frappe_payments.git",
              "branch": "master"
            },
            {
              "url":"https://github.com/Excel-Technologies-Ltd/frappe_meta.git",
              "branch": "master"
            }
          ]'

          # Convert apps JSON to base64
          export APPS_JSON_BASE64=$(echo ${APPS_JSON} | base64 -w 0)

          # Define all tags
          HARBOR_TAG="${REGISTRY}/${HARBOR_PROJECT}/admin-erp:${TAG}"

          # Build and push to Harbor
          docker buildx build \
            --no-cache \
            --platform linux/amd64 \
            --build-arg FRAPPE_PATH=https://github.com/frappe/frappe \
            --build-arg FRAPPE_BRANCH=version-14 \
            --build-arg PYTHON_VERSION=3.11.9 \
            --build-arg NODE_VERSION=20.19.2 \
            --build-arg APPS_JSON_BASE64="$APPS_JSON_BASE64" \
            --tag "$HARBOR_TAG" \
            --file images/custom/Containerfile \
            --push .
